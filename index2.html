<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignMaster AI | Real-time ASL</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://unpkg.com/lucide@0.321.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon: #00f5c4;
            --neon2: #7c3aed;
            --bg: #080c14;
            --card: #0d1424;
            --border: rgba(255,255,255,0.07);
        }

        * { box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Space Mono', monospace; min-height: 100vh; }
        h1, h2, .display { font-family: 'Syne', sans-serif; }

        .view { display: none; }
        .view.active { display: block; }

        /* Video */
        #video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            overflow: hidden;
            border-radius: 1.5rem;
            background: #000;
            border: 1px solid var(--border);
            box-shadow: 0 0 60px rgba(0,245,196,0.08);
        }
        #webcam { transform: rotateY(180deg); width: 100%; height: auto; display: block; }
        #output_canvas {
            position: absolute; left: 0; top: 0;
            width: 100%; height: 100%;
            transform: rotateY(180deg);
        }
        .hud-overlay {
            position: absolute; inset: 0;
            pointer-events: none;
            display: flex; flex-direction: column;
            justify-content: space-between;
            padding: 1.2rem;
        }

        /* Hold ring */
        #hold-ring-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        #hold-ring-svg { width: 160px; height: 160px; display: none; }
        #hold-ring-circle {
            fill: none;
            stroke: var(--neon);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            transform: rotate(-90deg);
            transform-origin: center;
            transition: stroke-dashoffset 0.1s linear;
            filter: drop-shadow(0 0 8px var(--neon));
        }

        /* Letter display */
        .letter-box {
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,245,196,0.2);
            border-radius: 1rem;
            padding: 0.6rem 1rem;
        }

        /* Score pill */
        .score-pill {
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.4rem 1rem;
            font-size: 0.7rem;
            font-weight: 700;
            display: flex; align-items: center; gap: 0.4rem;
        }

        /* Confidence bar */
        #conf-bar-track {
            width: 100%; background: rgba(255,255,255,0.08);
            height: 5px; border-radius: 999px; overflow: hidden;
        }
        #conf-bar {
            background: linear-gradient(90deg, var(--neon2), var(--neon));
            height: 100%; width: 0%;
            transition: width 0.2s ease;
            box-shadow: 0 0 10px var(--neon);
        }

        /* Letter strip */
        .letter-strip {
            display: flex; gap: 6px; overflow-x: auto; padding: 4px;
        }
        .letter-chip {
            min-width: 32px; height: 32px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.75rem;
            border: 1px solid var(--border);
            background: var(--card);
            flex-shrink: 0;
            transition: all 0.3s;
        }
        .letter-chip.done { background: var(--neon); color: #000; border-color: var(--neon); }
        .letter-chip.current { border-color: var(--neon); color: var(--neon); box-shadow: 0 0 10px rgba(0,245,196,0.3); }

        /* Dashboard cards */
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            padding: 1.5rem;
        }

        /* Success flash */
        @keyframes flashGreen {
            0% { box-shadow: 0 0 0 0 rgba(0,245,196,0); }
            50% { box-shadow: 0 0 40px 20px rgba(0,245,196,0.3); }
            100% { box-shadow: 0 0 0 0 rgba(0,245,196,0); }
        }
        .flash-success { animation: flashGreen 0.6s ease; }

        /* Neon btn */
        .btn-neon {
            background: var(--neon);
            color: #000;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            border-radius: 0.75rem;
            padding: 0.75rem 2rem;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            border: none; cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-neon:hover { opacity: 0.85; transform: translateY(-1px); }

        .btn-ghost {
            background: transparent;
            color: rgba(255,255,255,0.5);
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            border: none; cursor: pointer;
            transition: color 0.2s;
        }
        .btn-ghost:hover { color: #fff; }

        /* Nav */
        nav {
            position: fixed; top: 0; width: 100%;
            background: rgba(8,12,20,0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            z-index: 50;
        }

        .hero-gradient {
            background: linear-gradient(135deg, #0d1424 0%, #12102a 100%);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .hero-gradient::before {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(0,245,196,0.12) 0%, transparent 70%);
            top: -50px; right: -50px;
            border-radius: 50%;
        }

        /* Scrollbar */
        .letter-strip::-webkit-scrollbar { height: 4px; }
        .letter-strip::-webkit-scrollbar-track { background: transparent; }
        .letter-strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Nav -->
    <nav>
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div style="background:var(--neon2)" class="p-1.5 rounded-lg">
                    <i data-lucide="hand" class="w-4 h-4"></i>
                </div>
                <span class="font-bold text-lg" style="font-family:'Syne',sans-serif;">SignMaster <span style="color:var(--neon)">AI</span></span>
            </div>
            <div class="flex gap-4 items-center">
                <button onclick="router.navigate('home')" class="btn-ghost">Home</button>
                <button onclick="router.navigate('ai-mode')" class="btn-neon" style="padding:0.5rem 1.2rem">Try AI Mode</button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6 pt-24 pb-16">

        <!-- HOME -->
        <section id="home" class="view active">
            <div class="hero-gradient p-8 mb-8">
                <p class="text-xs font-bold mb-2" style="color:var(--neon);letter-spacing:0.15em">ASL TRAINER</p>
                <h1 class="text-4xl font-black mb-3">Master the<br>Alphabet.</h1>
                <p style="color:rgba(255,255,255,0.5);font-size:0.85rem" class="mb-6">
                    Real-time AI feedback. Hold the correct sign for 2 seconds to advance.
                </p>
                <button onclick="router.navigate('ai-mode')" class="btn-neon flex items-center gap-2">
                    <i data-lucide="camera" class="w-4 h-4"></i> Launch AI Tutor
                </button>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-8">
                <div class="stat-card">
                    <p style="color:rgba(255,255,255,0.4);font-size:0.7rem;letter-spacing:0.1em" class="mb-1">SCORE</p>
                    <p class="text-2xl font-bold" id="home-score">0</p>
                </div>
                <div class="stat-card">
                    <p style="color:rgba(255,255,255,0.4);font-size:0.7rem;letter-spacing:0.1em" class="mb-1">LETTERS</p>
                    <p class="text-2xl font-bold" id="home-letters">0 / 26</p>
                </div>
                <div class="stat-card">
                    <p style="color:rgba(255,255,255,0.4);font-size:0.7rem;letter-spacing:0.1em" class="mb-1">ACCURACY</p>
                    <p class="text-2xl font-bold" id="home-accuracy">–</p>
                </div>
            </div>

            <div class="stat-card">
                <p style="color:rgba(255,255,255,0.4);font-size:0.7rem;letter-spacing:0.1em" class="mb-3">PROGRESS</p>
                <div class="letter-strip" id="home-strip"></div>
            </div>
        </section>

        <!-- AI MODE -->
        <section id="ai-mode" class="view">
            <div class="flex items-center justify-between mb-5">
                <div>
                    <h2 class="text-2xl font-black" style="font-family:'Syne',sans-serif;">AI Tutor</h2>
                    <p style="color:rgba(255,255,255,0.4);font-size:0.78rem" id="ai-status">Loading model…</p>
                </div>
                <button onclick="router.navigate('home')" class="btn-ghost flex items-center gap-1">
                    <i data-lucide="x" class="w-4 h-4"></i> Close
                </button>
            </div>

            <!-- Letter strip -->
            <div class="letter-strip mb-5" id="ai-strip"></div>

            <div id="video-container" class="mx-auto shadow-2xl">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="output_canvas"></canvas>

                <!-- Hold ring -->
                <div id="hold-ring-wrap">
                    <svg id="hold-ring-svg" viewBox="0 0 160 160">
                        <circle cx="80" cy="80" r="70" id="hold-ring-circle"/>
                    </svg>
                </div>

                <!-- HUD -->
                <div class="hud-overlay">
                    <div class="flex justify-between items-start">
                        <!-- Target -->
                        <div class="letter-box">
                            <p style="font-size:0.6rem;letter-spacing:0.12em;color:var(--neon)" class="font-bold mb-0.5">TARGET SIGN</p>
                            <p class="text-5xl font-black" id="target-letter" style="font-family:'Syne',sans-serif;line-height:1">A</p>
                        </div>
                        <!-- Status + Score -->
                        <div class="flex flex-col gap-2 items-end">
                            <div class="letter-box text-right">
                                <p style="font-size:0.6rem;letter-spacing:0.12em;color:rgba(255,255,255,0.4)" class="font-bold mb-0.5">STATUS</p>
                                <p style="font-size:0.75rem;font-weight:700" id="tracking-status" class="text-red-400">NO HAND</p>
                            </div>
                            <div class="score-pill">
                                <i data-lucide="star" class="w-3 h-3" style="color:var(--neon)"></i>
                                <span id="hud-score">0 pts</span>
                            </div>
                        </div>
                    </div>

                    <!-- Bottom: Confidence -->
                    <div>
                        <div class="letter-box" style="max-width:320px;margin:0 auto">
                            <div class="flex justify-between mb-1.5">
                                <span style="font-size:0.65rem;letter-spacing:0.1em;font-weight:700">CONFIDENCE</span>
                                <span style="font-size:0.65rem;font-weight:700;color:var(--neon)" id="conf-val">0%</span>
                            </div>
                            <div id="conf-bar-track"><div id="conf-bar"></div></div>
                            <p style="font-size:0.7rem;text-align:center;margin-top:0.5rem;color:rgba(255,255,255,0.6)" id="ai-prompt">Position your hand in frame</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-5 flex justify-center gap-3">
                <button id="camera-btn" class="btn-neon">Start Camera</button>
            </div>

            <!-- Success toast -->
            <div id="success-toast" style="
                display:none; position:fixed; top:80px; left:50%; transform:translateX(-50%);
                background:var(--neon); color:#000; font-weight:700; font-size:0.85rem;
                padding:0.6rem 1.5rem; border-radius:999px; z-index:999;
                font-family:'Space Mono',monospace; white-space:nowrap;
            "></div>
        </section>
    </main>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const LETTERS = 'ABCDEFGHIKLMNOPQRSTUVWXY'.split(''); // Standard static ASL letters (no J/Z = motion)
const HOLD_MS = 2000; // 2 seconds to confirm
const THRESHOLD = 0.7; // 70% confidence to start hold

// ─── STATE ────────────────────────────────────────────────────────────────────
const state = {
    letterIndex: 0,
    score: 0,
    completed: new Set(),
    attempts: 0,
    holdStart: null,
    holding: false,
};

// ─── ROUTER ───────────────────────────────────────────────────────────────────
const router = {
    navigate(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (id === 'ai-mode') app.initAI();
        if (id === 'home') updateHomeStats();
        lucide.createIcons();
    }
};

// ─── UI HELPERS ───────────────────────────────────────────────────────────────
function buildStrip(containerId) {
    const el = document.getElementById(containerId);
    el.innerHTML = '';
    LETTERS.forEach((l, i) => {
        const chip = document.createElement('div');
        chip.className = 'letter-chip';
        chip.id = `chip-${containerId}-${l}`;
        chip.textContent = l;
        if (state.completed.has(l)) chip.classList.add('done');
        else if (i === state.letterIndex) chip.classList.add('current');
        el.appendChild(chip);
    });
}

function updateStrips() {
    buildStrip('ai-strip');
    buildStrip('home-strip');
}

function updateHomeStats() {
    document.getElementById('home-score').textContent = state.score;
    document.getElementById('home-letters').textContent = `${state.completed.size} / ${LETTERS.length}`;
    const acc = state.attempts > 0 ? Math.round((state.completed.size / state.attempts) * 100) + '%' : '–';
    document.getElementById('home-accuracy').textContent = acc;
    buildStrip('home-strip');
}

function setConfidence(val) {
    document.getElementById('conf-bar').style.width = val + '%';
    document.getElementById('conf-val').textContent = val + '%';
}

function showToast(msg) {
    const t = document.getElementById('success-toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 1800);
}

function setHoldRing(fraction) {
    const svg = document.getElementById('hold-ring-svg');
    const circle = document.getElementById('hold-ring-circle');
    if (fraction <= 0) { svg.style.display = 'none'; return; }
    svg.style.display = 'block';
    const circumference = 440;
    circle.style.strokeDashoffset = circumference * (1 - fraction);
}

// ─── ASL CLASSIFIERS ─────────────────────────────────────────────────────────
// MediaPipe landmark indices:
// Thumb: 1(CMC),2(MCP),3(IP),4(TIP)
// Index: 5(MCP),6(PIP),7(DIP),8(TIP)
// Middle: 9(MCP),10(PIP),11(DIP),12(TIP)
// Ring: 13(MCP),14(PIP),15(DIP),16(TIP)
// Pinky: 17(MCP),18(PIP),19(DIP),20(TIP)
// Wrist: 0

function fingerExtended(lm, tip, pip) {
    return lm[tip].y < lm[pip].y;
}
function fingerCurled(lm, tip, mcp) {
    return lm[tip].y > lm[mcp].y;
}
function fingersTogether(lm, tip1, tip2, thresh = 0.05) {
    return Math.abs(lm[tip1].x - lm[tip2].x) < thresh;
}
function thumbExtendedRight(lm) {
    // Thumb tip further left than thumb IP (for right hand mirrored)
    return lm[4].x < lm[3].x;
}
function thumbCurled(lm) {
    return lm[4].x > lm[3].x && lm[4].x > lm[2].x;
}

const classifiers = {
    // A: All fingers curled into fist, thumb alongside
    A(lm) {
        const fc = fingerCurled(lm, 8, 5) && fingerCurled(lm, 12, 9)
                && fingerCurled(lm, 16, 13) && fingerCurled(lm, 20, 17);
        return fc ? 0.92 : 0;
    },
    // B: 4 fingers up straight & together, thumb tucked across palm
    B(lm) {
        const index  = fingerExtended(lm, 8, 6);
        const middle = fingerExtended(lm, 12, 10);
        const ring   = fingerExtended(lm, 16, 14);
        const pinky  = fingerExtended(lm, 20, 18);
        const thumbTucked = lm[4].x > lm[5].x; // thumb tip behind index MCP
        const together = fingersTogether(lm, 8, 12, 0.07)
                      && fingersTogether(lm, 12, 16, 0.07)
                      && fingersTogether(lm, 16, 20, 0.07);
        if (index && middle && ring && pinky && thumbTucked && together) return 0.93;
        if (index && middle && ring && pinky && thumbTucked) return 0.75;
        return 0;
    },
    // C: All fingers curved into C shape
    C(lm) {
        // Fingers semi-extended, not fully curled or straight
        const partialIndex = lm[8].y < lm[5].y && lm[8].y > lm[6].y - 0.05;
        const thumbOut = lm[4].x < lm[5].x;
        return (partialIndex && thumbOut) ? 0.80 : 0;
    },
    // D: Index up, others curled, thumb touches middle
    D(lm) {
        const index = fingerExtended(lm, 8, 6);
        const middleCurled = fingerCurled(lm, 12, 9);
        const ringCurled   = fingerCurled(lm, 16, 13);
        const pinkyCurled  = fingerCurled(lm, 20, 17);
        return (index && middleCurled && ringCurled && pinkyCurled) ? 0.88 : 0;
    },
    // E: All fingers bent/curled, thumb tucked
    E(lm) {
        const allCurled = lm[8].y > lm[6].y && lm[12].y > lm[10].y
                       && lm[16].y > lm[14].y && lm[20].y > lm[18].y;
        return allCurled ? 0.82 : 0;
    },
    // F: Index+thumb circle, others up
    F(lm) {
        const middle = fingerExtended(lm, 12, 10);
        const ring   = fingerExtended(lm, 16, 14);
        const pinky  = fingerExtended(lm, 20, 18);
        const indexDown = lm[8].y > lm[6].y;
        return (middle && ring && pinky && indexDown) ? 0.83 : 0;
    },
    // G: Index points sideways, thumb parallel
    G(lm) {
        const indexOut = Math.abs(lm[8].x - lm[5].x) > 0.1;
        const others = fingerCurled(lm, 12, 9) && fingerCurled(lm, 16, 13) && fingerCurled(lm, 20, 17);
        return (indexOut && others) ? 0.78 : 0;
    },
    // H: Index+middle extended sideways together
    H(lm) {
        const index = fingerExtended(lm, 8, 6);
        const middle = fingerExtended(lm, 12, 10);
        const ring = fingerCurled(lm, 16, 13);
        const pinky = fingerCurled(lm, 20, 17);
        return (index && middle && ring && pinky) ? 0.80 : 0;
    },
    // I: Pinky up, others curled
    I(lm) {
        const pinky = fingerExtended(lm, 20, 18);
        const rest = fingerCurled(lm, 8, 5) && fingerCurled(lm, 12, 9) && fingerCurled(lm, 16, 13);
        return (pinky && rest) ? 0.88 : 0;
    },
    // K: Index+middle up, thumb between them
    K(lm) {
        const index = fingerExtended(lm, 8, 6);
        const middle = fingerExtended(lm, 12, 10);
        const ring = fingerCurled(lm, 16, 13);
        const pinky = fingerCurled(lm, 20, 17);
        return (index && middle && ring && pinky) ? 0.78 : 0; // Similar to H, rough heuristic
    },
    // L: Index up, thumb out, others curled
    L(lm) {
        const index = fingerExtended(lm, 8, 6);
        const thumbOut = lm[4].x < lm[2].x;
        const rest = fingerCurled(lm, 12, 9) && fingerCurled(lm, 16, 13) && fingerCurled(lm, 20, 17);
        return (index && thumbOut && rest) ? 0.90 : 0;
    },
    // M: 3 fingers over thumb
    M(lm) {
        const allDown = fingerCurled(lm, 8, 5) && fingerCurled(lm, 12, 9) && fingerCurled(lm, 16, 13);
        const pinkyDown = fingerCurled(lm, 20, 17);
        return (allDown && pinkyDown) ? 0.75 : 0;
    },
    // N: 2 fingers over thumb
    N(lm) {
        const allDown = fingerCurled(lm, 8, 5) && fingerCurled(lm, 12, 9);
        const others = fingerCurled(lm, 16, 13) && fingerCurled(lm, 20, 17);
        return (allDown && others) ? 0.74 : 0;
    },
    // O: All fingers form O shape with thumb
    O(lm) {
        const curve = lm[8].y > lm[6].y && lm[12].y > lm[10].y;
        const thumbNear = Math.abs(lm[4].x - lm[8].x) < 0.08 && Math.abs(lm[4].y - lm[8].y) < 0.08;
        return (curve && thumbNear) ? 0.82 : 0;
    },
    // P: Index points down, thumb out
    P(lm) {
        const indexDown = lm[8].y > lm[5].y;
        const thumbOut = lm[4].x < lm[3].x;
        return (indexDown && thumbOut) ? 0.76 : 0;
    },
    // Q: Index+thumb pointing down
    Q(lm) {
        const indexDown = lm[8].y > lm[5].y;
        const thumbDown = lm[4].y > lm[2].y;
        return (indexDown && thumbDown) ? 0.74 : 0;
    },
    // R: Index+middle crossed
    R(lm) {
        const index = fingerExtended(lm, 8, 6);
        const middle = fingerExtended(lm, 12, 10);
        const crossed = Math.abs(lm[8].x - lm[12].x) < 0.03;
        return (index && middle && crossed) ? 0.80 : 0;
    },
    // S: Fist with thumb over fingers
    S(lm) {
        const fist = fingerCurled(lm, 8, 5) && fingerCurled(lm, 12, 9)
                  && fingerCurled(lm, 16, 13) && fingerCurled(lm, 20, 17);
        return fist ? 0.80 : 0; // Same base as A, slight overlap
    },
    // T: Thumb between index+middle
    T(lm) {
        const allCurled = fingerCurled(lm, 8, 5) && fingerCurled(lm, 12, 9)
                       && fingerCurled(lm, 16, 13) && fingerCurled(lm, 20, 17);
        return allCurled ? 0.72 : 0;
    },
    // U: Index+middle up together
    U(lm) {
        const index = fingerExtended(lm, 8, 6);
        const middle = fingerExtended(lm, 12, 10);
        const ring = fingerCurled(lm, 16, 13);
        const pinky = fingerCurled(lm, 20, 17);
        const together = fingersTogether(lm, 8, 12, 0.04);
        return (index && middle && ring && pinky && together) ? 0.85 : 0;
    },
    // V: Index+middle up, spread (peace sign)
    V(lm) {
        const index = fingerExtended(lm, 8, 6);
        const middle = fingerExtended(lm, 12, 10);
        const ring = fingerCurled(lm, 16, 13);
        const pinky = fingerCurled(lm, 20, 17);
        const spread = Math.abs(lm[8].x - lm[12].x) > 0.06;
        return (index && middle && ring && pinky && spread) ? 0.87 : 0;
    },
    // W: Index+middle+ring up, spread
    W(lm) {
        const index = fingerExtended(lm, 8, 6);
        const middle = fingerExtended(lm, 12, 10);
        const ring = fingerExtended(lm, 16, 14);
        const pinky = fingerCurled(lm, 20, 17);
        return (index && middle && ring && pinky) ? 0.84 : 0;
    },
    // X: Index hooked
    X(lm) {
        const indexHook = lm[8].y > lm[7].y && lm[8].y < lm[5].y;
        const rest = fingerCurled(lm, 12, 9) && fingerCurled(lm, 16, 13) && fingerCurled(lm, 20, 17);
        return (indexHook && rest) ? 0.78 : 0;
    },
    // Y: Pinky+thumb out, others curled
    Y(lm) {
        const pinky = fingerExtended(lm, 20, 18);
        const thumbOut = lm[4].x < lm[3].x;
        const rest = fingerCurled(lm, 8, 5) && fingerCurled(lm, 12, 9) && fingerCurled(lm, 16, 13);
        return (pinky && thumbOut && rest) ? 0.88 : 0;
    },
};

function recognizeSign(lm, letter) {
    const fn = classifiers[letter];
    if (!fn) return 0;
    return fn(lm);
}

// ─── APP ─────────────────────────────────────────────────────────────────────
const app = {
    hands: null,
    cameraActive: false,

    async initAI() {
        updateStrips();
        document.getElementById('target-letter').textContent = LETTERS[state.letterIndex];
        document.getElementById('hud-score').textContent = state.score + ' pts';

        if (this.hands) return;

        this.hands = new Hands({
            locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
        });
        this.hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.5
        });
        this.hands.onResults(results => app.onResults(results));

        document.getElementById('ai-status').textContent = 'Model ready. Grant camera access.';
        document.getElementById('camera-btn').onclick = () => this.startCamera();
        lucide.createIcons();
    },

    async startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.getElementById('webcam');
            video.srcObject = stream;
            this.cameraActive = true;
            document.getElementById('camera-btn').style.display = 'none';
            document.getElementById('ai-status').textContent = 'AI Active';
            this.renderLoop();
        } catch {
            alert('Camera access denied or unavailable.');
        }
    },

    async renderLoop() {
        if (!this.cameraActive) return;
        const video = document.getElementById('webcam');
        await this.hands.send({ image: video });
        requestAnimationFrame(() => this.renderLoop());
    },

    onResults(results) {
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = results.image.width;
        canvas.height = results.image.height;

        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            document.getElementById('tracking-status').textContent = 'TRACKING';
            document.getElementById('tracking-status').className = '';
            document.getElementById('tracking-status').style.cssText = 'font-size:0.75rem;font-weight:700;color:var(--neon)';

            for (const lm of results.multiHandLandmarks) {
                drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: '#00f5c4', lineWidth: 3 });
                drawLandmarks(ctx, lm, { color: '#ffffff', lineWidth: 1, radius: 4 });
                this.processSign(lm);
            }
        } else {
            document.getElementById('tracking-status').textContent = 'NO HAND';
            document.getElementById('tracking-status').style.cssText = 'font-size:0.75rem;font-weight:700;color:#f87171';
            setConfidence(0);
            setHoldRing(0);
            state.holdStart = null;
            state.holding = false;
            document.getElementById('ai-prompt').textContent = 'Position your hand in frame';
        }

        ctx.restore();
    },

    processSign(lm) {
        if (state.letterIndex >= LETTERS.length) return;
        const targetLetter = LETTERS[state.letterIndex];
        const conf = recognizeSign(lm, targetLetter);
        const pct = Math.round(conf * 100);
        setConfidence(pct);

        state.attempts++;

        if (conf >= THRESHOLD) {
            // Start or continue hold
            if (!state.holding) {
                state.holdStart = Date.now();
                state.holding = true;
            }
            const elapsed = Date.now() - state.holdStart;
            const fraction = Math.min(elapsed / HOLD_MS, 1);
            setHoldRing(fraction);

            const remaining = Math.ceil((HOLD_MS - elapsed) / 1000);
            document.getElementById('ai-prompt').textContent =
                fraction >= 1 ? '✓ Perfect!' : `Hold… ${remaining}s`;
            document.getElementById('ai-prompt').style.color = 'var(--neon)';

            if (fraction >= 1) {
                this.advanceLetter(targetLetter);
            }
        } else {
            state.holding = false;
            state.holdStart = null;
            setHoldRing(0);
            document.getElementById('ai-prompt').textContent =
                `Show the sign for "${targetLetter}"`;
            document.getElementById('ai-prompt').style.color = 'rgba(255,255,255,0.6)';
        }
    },

    advanceLetter(letter) {
        state.completed.add(letter);
        state.score += 10;
        state.holding = false;
        state.holdStart = null;
        setHoldRing(0);

        // Flash effect
        document.getElementById('video-container').classList.add('flash-success');
        setTimeout(() => document.getElementById('video-container').classList.remove('flash-success'), 600);

        showToast(`✓ ${letter} — +10 pts!`);
        document.getElementById('hud-score').textContent = state.score + ' pts';

        state.letterIndex++;
        if (state.letterIndex >= LETTERS.length) {
            document.getElementById('target-letter').textContent = '🎉';
            document.getElementById('ai-prompt').textContent = 'All done! Amazing work!';
            document.getElementById('ai-status').textContent = 'Complete!';
        } else {
            document.getElementById('target-letter').textContent = LETTERS[state.letterIndex];
            document.getElementById('ai-prompt').textContent = `Next: Show "${LETTERS[state.letterIndex]}"`;
            document.getElementById('ai-prompt').style.color = 'rgba(255,255,255,0.6)';
        }

        updateStrips();
        lucide.createIcons();
    }
};

// ─── INIT ─────────────────────────────────────────────────────────────────────
window.onload = () => {
    lucide.createIcons();
    buildStrip('home-strip');
};
</script>
